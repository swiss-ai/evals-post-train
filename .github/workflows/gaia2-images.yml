name: GAIA2 images

# Builds gaia2-cli's scenario images (facebookresearch/meta-agents-research-environments,
# gaia2-cli/) at the commit scripts/gaia2/run.py pins (ARE_COMMIT, also in
# requirements/gaia2-runtime.txt), for linux/amd64 (the OpenSandbox microVMs), and pushes:
#   ghcr.io/<owner>/gaia2-cli:<commit>     the base: Python, the app CLIs, the judge, the files
#   ghcr.io/<owner>/gaia2-oc:<commit>      OpenClaw (run_gaia2_eval.sh's agent)
#   ghcr.io/<owner>/gaia2-oracle:<commit>  the reference actions replayed (--gold)
# The sandboxes pull them without credentials: the packages must be public (once, in each
# package's settings). gaia2-runner picks its container profile from the image name, so the
# names must keep "gaia2-oc" and "gaia2-oracle".
on:
  push:
    paths:
      - .github/workflows/gaia2-images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: gaia2-images-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  ARE_COMMIT: a9fd2edccb4bc7e22fbf45c8482a5fef30a2a5a4
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out gaia2-cli at the pinned commit
        uses: actions/checkout@v7
        with:
          repository: facebookresearch/meta-agents-research-environments
          ref: ${{ env.ARE_COMMIT }}
          path: are

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Base image (gaia2-cli)
        uses: docker/build-push-action@v6
        with:
          context: are/gaia2-cli
          file: are/gaia2-cli/cli/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/gaia2-cli:${{ env.ARE_COMMIT }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=gaia2-cli
          cache-to: type=gha,mode=max,scope=gaia2-cli

      - name: OpenClaw image (gaia2-oc)
        uses: docker/build-push-action@v6
        with:
          context: are/gaia2-cli
          file: are/gaia2-cli/containers/openclaw/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            GAIA2_CLI_IMAGE=${{ env.REGISTRY }}/gaia2-cli
            GAIA2_CLI_VERSION=${{ env.ARE_COMMIT }}
          tags: ${{ env.REGISTRY }}/gaia2-oc:${{ env.ARE_COMMIT }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=gaia2-oc
          cache-to: type=gha,mode=max,scope=gaia2-oc

      - name: Oracle image (gaia2-oracle)
        uses: docker/build-push-action@v6
        with:
          context: are/gaia2-cli
          file: are/gaia2-cli/containers/oracle/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            GAIA2_CLI_IMAGE=${{ env.REGISTRY }}/gaia2-cli
            GAIA2_CLI_VERSION=${{ env.ARE_COMMIT }}
          tags: ${{ env.REGISTRY }}/gaia2-oracle:${{ env.ARE_COMMIT }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=gaia2-oracle
          cache-to: type=gha,mode=max,scope=gaia2-oracle

      - name: Check the images start their adapter's runtime
        run: |
          for image in gaia2-oc gaia2-oracle; do
            docker run --rm --platform linux/amd64 --entrypoint bash "$REGISTRY/$image:$ARE_COMMIT" \
              -c 'test -x /opt/gaia2-init-entrypoint.sh || test -f /opt/gaia2-init-entrypoint.sh; command -v gaia2-init gaia2-eventd curl tar'
          done
