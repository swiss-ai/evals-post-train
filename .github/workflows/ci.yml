name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Offline checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and CI dependencies
        run: python -m pip install --editable ".[ci]"

      - name: Check shell syntax
        shell: bash
        run: |
          git ls-files -z -- '*.sh' '*.sbatch' |
            xargs -0 -r -n1 bash -n

      - name: Run ShellCheck
        shell: bash
        run: |
          git ls-files -z -- '*.sh' '*.sbatch' |
            xargs -0 -r shellcheck --severity=error

      - name: Check Python syntax
        shell: bash
        run: |
          git ls-files -z -- '*.py' |
            xargs -0 -r python -m py_compile

      - name: Validate JSON configuration
        run: |
          python -m json.tool configs/tasks.json >/dev/null
          python -m json.tool configs/eval_export/task_mappings.json >/dev/null

      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
