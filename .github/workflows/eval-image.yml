name: Evaluation image

# Publishes containers/Dockerfile.eval for every pushed commit that changes
# what the image is built from (the paths below), on every branch. A run picks
# the image tagged with the exact commit whose scripts it runs; for a commit
# without one, evals-svc (app/services/eval_image.py, IMAGE_INPUTS) uses the
# nearest ancestor whose image inputs are unchanged, which is the same image.
# Keep the paths in step with what the Dockerfile COPYs. A commit that needs an
# image anyway: run this workflow by hand (workflow_dispatch) on it.
on:
  push:
    paths:
      - containers/Dockerfile.eval
      - requirements/**
      - .github/workflows/eval-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# A newer push to a branch replaces that branch's build in progress. Never on
# main: its commits are what runs pin, and each should get its image.
concurrency:
  group: eval-image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the evaluation image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/Dockerfile.eval
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/evals-post-train-eval:${{ github.sha }}
          cache-from: type=gha,scope=eval-image
          cache-to: type=gha,mode=max,scope=eval-image
