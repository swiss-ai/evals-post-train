name: Evaluation image

# Publishes containers/Dockerfile.eval for every pushed commit, on every
# branch: a run picks the image tagged with the exact commit whose scripts it
# runs, so packages and scripts always match. Unchanged requirements come
# straight from the layer cache.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: eval-image-${{ github.sha }}

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the evaluation image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/Dockerfile.eval
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/evals-post-train-eval:${{ github.sha }}
          cache-from: type=gha,scope=eval-image
          cache-to: type=gha,mode=max,scope=eval-image
