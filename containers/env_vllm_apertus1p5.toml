# Serving/eval environment for Apertus-v1.5 (model_type: apertus1p5).
#
# env_vllm.toml's image (vllm_container_0221.sqsh) cannot serve this architecture: its
# vLLM registry has ApertusForCausalLM only, and its transformers does not register
# apertus1p5. This image has both - vLLM registers Apertus1p5ForConditionalGeneration,
# and transformers registers models/apertus1p5.
#
# Rebuilt 2026-09-03 on top of the same base release image, with swiss-ai/transformers
# from feature/apertus_1p5_pipeline @ 3ccf96a (2026-08-10, "tf0810") installed over the
# bundled 5.14.0.dev0 -> 5.15.0.dev0. Verified before export: AutoConfig/auto-class
# mapping still resolve Apertus1p5Config, vLLM still registers
# Apertus1p5ForConditionalGeneration, and upstream's offloaded-save fix (#47336) is
# present. See scripts/build_serving_image.sh --flavor serving in apertus-quantization.
#
# Deliberately not the llm-compressor one used for quantising
# (~/.edf/vllm_apertus_1.5_release_quant.toml): installing llm-compressor there raised
# compressed-tensors to 0.18.0, while this vLLM build pins ==0.17.0.

image = "/iopsstor/scratch/cscs/ichalkiadakis/vllm_apertus_1.5_release_tf0810-arm64.sqsh"

mounts = [
  "/capstor/store/cscs/swissai/infra01/opentela-share:/opentelabin",
  "/capstor",
  "/iopsstor",
  "/users/${USER}",
  "/etc/slurm",
  "/usr/lib64/libhwloc.so.15:/usr/lib/libhwloc.so.15",
  "/usr/lib64/libpciaccess.so.0:/usr/lib/libpciaccess.so.0",
  "/usr/lib64/libxml2.so.2:/usr/lib/libxml2.so.2",
  "/usr/lib64/libnuma.so.1:/usr/lib/libnuma.so.1",
]

[env]
PMIX_MCA_psec = "native"
NCCL_NET = "AWS Libfabric"
NCCL_CROSS_NIC = "1"
NCCL_NET_GDR_LEVEL = "PHB"
NCCL_SOCKET_IFNAME = "hsn"
NCCL_PROTO = "^LL128"
FI_CXI_COMPAT = "0"
FI_MR_CACHE_MONITOR = "userfaultfd"
FI_CXI_RX_MATCH_MODE = "software"
FI_CXI_DEFAULT_CQ_SIZE = "131072"
FI_CXI_DEFAULT_TX_SIZE = "32768"
FI_CXI_DISABLE_HOST_REGISTER = "1"
OFI_NCCL_DISABLE_DMABUF = "1"
VLLM_ALLREDUCE_USE_SYMM_MEM = "0"

[annotations]
com.hooks.aws_ofi_nccl.enabled = "true"
com.hooks.aws_ofi_nccl.variant = "cuda13"
com.hooks.cxi.enabled = "true"
